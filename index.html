<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>BRAIN 0 — Web</title>
	<link rel="stylesheet" href="css/shell.css" />
	<script>
		// GitHub Pages cannot set COOP/COEP response headers. The deployment
		// workflow places this local service-worker script beside index.html.
		if (location.protocol === "https:" && !window.crossOriginIsolated) {
			document.write('<script src="coi-serviceworker.js"><\/script>');
		}
	</script>
</head>

<body>

	<div id="tabbar">
		<button id="tab-btn-ambient" class="tab-btn active" data-tab="ambient">BRAIN 0</button>
		<div class="spacer"></div>
		<button id="stop-btn" class="stop-btn" disabled>Stop Audio</button>
		<div class="status" id="global-status">idle</div>
	</div>

	<div id="panel-ambient" class="tabpanel active">
		<div class="boot-gate" id="gate-ambient">
			<div>BRAIN 0 — 4-layer drone/pad/atmos/noise engine</div>
			<button id="boot-ambient">Start Audio</button>
			<div class="hint">Press Start to load the Ambient Zero audio engine. Browsers require a user gesture before audio can play.</div>
		</div>
	</div>

	<script type="module">
		let loaded = false;
		let handle = null;
		const status = document.getElementById("global-status");
		const stopBtn = document.getElementById("stop-btn");

		// The AudioContext MUST be created (and resumed) synchronously inside the
		// click handler, before any `await` — browsers only count the click as a
		// user gesture for a very short window, and the dynamic import() + boot
		// chain below easily outlasts it if the context is created later. Creating
		// it here first and handing it down to SuperSonic is what actually lets
		// audio start reliably (this was the #1 "no audio" bug in earlier builds).
		function makeResumedAudioContext() {
			const AC = window.AudioContext || window.webkitAudioContext;
			const ctx = new AC();
			if (ctx.state !== "running") ctx.resume().catch((e) => console.warn("AudioContext resume failed:", e));
			return ctx;
		}

		async function bootAmbient() {
			if (loaded) return;
			loaded = true;
			const name = "ambient";
			const btn = document.getElementById("boot-ambient");
			let audioContext;
			try {
				audioContext = makeResumedAudioContext(); // synchronous within the click gesture
			} catch (err) {
				console.error(err);
				status.textContent = "audio is unavailable in this browser";
				btn.disabled = false;
				btn.textContent = "Retry";
				loaded = false;
				return;
			}
			status.textContent = "loading " + name + "…";
			btn.disabled = true;
			btn.textContent = "Loading…";
			try {
				const mod = await import("./js/ambient/ambient-app.js");
				const gate = document.getElementById("gate-ambient");
				const panel = document.getElementById("panel-ambient");
				handle = await mod.mount(panel, gate, audioContext);
				status.textContent = name + " running";
				stopBtn.disabled = false;
			} catch (err) {
				console.error(err);
				if (audioContext.state !== "closed") await audioContext.close().catch(() => {});
				status.textContent = name + " failed to load — see console";
				btn.disabled = false;
				btn.textContent = "Retry";
				loaded = false;
			}
		}

		stopBtn.addEventListener("click", async () => {
			if (!handle || !handle.teardown) { status.textContent = "nothing to stop"; return; }
			stopBtn.disabled = true;
			status.textContent = "stopping ambient…";
			try {
				await handle.teardown();
			} catch (err) {
				console.warn("Teardown error:", err);
			}
			handle = null;
			loaded = false;
			status.textContent = "ambient stopped";
			const btn = document.getElementById("boot-ambient");
			const gate = document.getElementById("gate-ambient");
			const panel = document.getElementById("panel-ambient");
			if (btn) { btn.disabled = false; btn.textContent = "Start Audio"; }
			if (gate && !gate.parentNode) panel.prepend(gate);
		});

		document.getElementById("boot-ambient").addEventListener("click", bootAmbient);
	</script>
</body>

</html>
